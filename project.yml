name: Agy
options:
  bundleIdPrefix: cc.nooh
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: 1.7.3

targets:
  AgyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AgyWidget
        excludes:
          - "Assets.xcassets"
      - path: AgyWidget/Assets.xcassets
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lake9674.aquila8809.widget
        PRODUCT_NAME: AgyWidget
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Agy
    info:
      path: AgyWidget/Info.plist
      properties:
        CFBundleDisplayName: Agy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  Agy:
    type: application
    platform: iOS
    sources:
      - path: Agy
        excludes:
          - "Resources"
      - path: Agy/Resources
        buildPhase: resources
      - path: Shared
    dependencies:
      - package: SwiftMath
        product: SwiftMath
      - target: AgyWidget
        embed: true
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lake9674.aquila8809
        PRODUCT_NAME: Agy
        INFOPLIST_FILE: Agy/Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "5.2.0"
        CURRENT_PROJECT_VERSION: "85"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_BITCODE: "NO"
        SUPPORTS_MACCATALYST: "NO"
