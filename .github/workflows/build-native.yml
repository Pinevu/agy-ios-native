name: Build Native IPA

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Agy/**'
      - 'project.yml'
      - '.github/workflows/build-native.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Agy.xcodeproj \
            -scheme Agy 2>&1 | tail -20

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Agy.xcodeproj \
            -scheme Agy \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -60

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Agy.app Payload/
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Payload/Agy.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" Payload/Agy.app/Info.plist)
          NAME="Antigravity-${VER}-${BUILD}.ipa"
          zip -r -9 "$NAME" Payload
          cp "$NAME" Antigravity.ipa
          ls -lh *.ipa
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: Antigravity.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: ignore
